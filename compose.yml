---
services:
    mysqldb:
      container_name: mysqldb
      image: charanmummidi/k8s_php:dbimage
      ports:
        - "3306:3306"

    application:
      container_name: mycont
      image: charanmummidi/k8s_php:appimage
      ports:
        - "1212:80"
      depends_on:
        - mysqldb
      
    
